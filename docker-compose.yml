# Todo el stack: Postgres + API Go + Next.js. Un solo comando:
#   docker compose up --build
#
# Los valores vienen del .env de la raíz (compose lo lee automáticamente);
# copia .env.example si no existe. Nada está harcodeado aquí.

services:
  postgres:
    image: postgres:17-alpine
    container_name: todo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-todos}
    ports:
      # Solo para clientes GUI / debugging; la API no lo usa.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - todo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-todos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: todo-api
    environment:
      ADDR: ":8080"
      # Dentro de la red de compose se resuelve el servicio "postgres".
      DATABASE_URL: postgres://${POSTGRES_USER:-todo}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-todos}?sslmode=disable
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    container_name: todo-web
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* se inyecta en build; el navegador habla con el host.
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  todo-pgdata:
